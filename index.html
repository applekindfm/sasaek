<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사과사색 출고·주소 변경</title>
<meta name="robots" content="noindex">
<style>
  :root{--red:#B3263A;--red-d:#8B1E2D;--bg:#FAF7F4;--card:#fff;--ink:#222;--sub:#6b6b6b;--line:#e7e1dc;--ok:#1f7a4d;--ok-bg:#eaf6ef;--warn-bg:#fff4e5}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:16px;line-height:1.5}
  .wrap{max-width:520px;margin:0 auto;padding:20px 16px 48px}
  header{text-align:center;margin:8px 0 20px}
  header .brand{color:var(--red);font-weight:700;letter-spacing:.02em;font-size:14px}
  header h1{font-size:21px;margin:4px 0 0}
  header .round{color:var(--sub);font-size:14px;margin-top:2px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
  label.f{display:block;font-size:14px;color:var(--sub);margin:12px 0 6px}
  input[type=text],input[type=tel],select{width:100%;padding:12px;border:1px solid #d6cfc9;border-radius:10px;font-size:16px;background:#fff}
  input:focus,select:focus{outline:2px solid var(--red);border-color:transparent}
  .btn{display:block;width:100%;padding:14px;border:0;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;margin-top:14px}
  .btn.p{background:var(--red);color:#fff}.btn.p:active{background:var(--red-d)}
  .btn.s{background:#fff;color:var(--ink);border:1px solid #d6cfc9}
  .btn.t{background:none;color:var(--sub);font-weight:400;text-decoration:underline;padding:8px}
  .btn:disabled{opacity:.5}
  .row{display:flex;gap:8px}.row>*{flex:1}
  .note{font-size:13px;color:var(--sub)}
  .info{background:var(--warn-bg);border-radius:10px;padding:12px;font-size:14px;margin-bottom:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px;min-height:1em}
  .chk{display:flex;align-items:flex-start;gap:8px;font-size:14px;margin-top:14px}
  .chk input{width:20px;height:20px;margin-top:1px;accent-color:var(--red)}
  .item h3{margin:0 0 6px;font-size:17px}
  .kv{display:grid;grid-template-columns:72px 1fr;gap:2px 8px;font-size:14px}
  .kv dt{color:var(--sub)}.kv dd{margin:0}
  .badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;margin-bottom:8px}
  .badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.no{background:#f1ede9;color:var(--sub)}
  .done{background:var(--ok-bg);border-radius:10px;padding:12px;margin-top:12px;font-size:14px}
  .done b{color:var(--ok)}
  .done ul{margin:6px 0 0;padding-left:18px}
  .blk{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px;background:#fffdfb}
  .blk h4{margin:0 0 4px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
  .blk h4 button{background:none;border:0;color:var(--sub);font-size:13px;text-decoration:underline;cursor:pointer}
  .toggle{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid #d6cfc9;border-radius:10px;margin-top:10px;cursor:pointer;font-weight:600;background:#fff}
  .toggle input{width:22px;height:22px;accent-color:var(--red)}
  .sub{padding:4px 4px 0 4px}
  .radios{display:flex;gap:8px;flex-wrap:wrap}
  .radios label{flex:1;min-width:120px;display:flex;align-items:center;gap:6px;padding:10px;border:1px solid #d6cfc9;border-radius:10px;font-size:14px;cursor:pointer;background:#fff}
  .radios input{accent-color:var(--red)}
  .stepper{display:flex;align-items:center;gap:10px}
  .stepper button{width:40px;height:40px;border-radius:10px;border:1px solid #d6cfc9;background:#fff;font-size:20px;cursor:pointer}
  .stepper span{min-width:64px;text-align:center;font-weight:700}
  #postWrap{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;padding:24px 12px}
  #postBox{max-width:520px;height:100%;margin:0 auto;background:#fff;border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
  #postBox .bar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700}
  #postBox .bar button{background:none;border:0;font-size:15px;cursor:pointer}
  #postInner{flex:1}
  .hide{display:none}
  .big-ok{text-align:center;padding:26px 10px 10px}
  .big-ok .ic{width:56px;height:56px;border-radius:50%;background:var(--ok-bg);color:var(--ok);font-size:30px;line-height:56px;margin:0 auto 10px}
  .big-ok h2{margin:0 0 4px;font-size:20px}
  .loading{position:fixed;inset:0;background:rgba(255,255,255,.6);display:none;align-items:center;justify-content:center;z-index:20;font-weight:700;color:var(--red)}
  footer{text-align:center;font-size:13px;color:var(--sub);margin-top:24px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">애플카인드</div>
    <h1>사과사색 출고일·주소 변경</h1>
    <div class="round" id="round"></div>
  </header>

  <!-- 1. 로그인 -->
  <section id="vLogin">
    <div class="info" id="loginInfo"></div>
    <div class="card">
      <div id="noLink" style="display:none;text-align:center;padding:10px 0">문자로 받으신 <b>개인 링크</b>를 눌러 접속해 주세요.<br><span class="note">링크마다 받으시는 분의 배송 정보만 보입니다.</span></div>
      <div id="nameWrap"><label class="f" for="inName">성함</label>
      <input type="text" id="inName" autocomplete="name" placeholder="예) 홍길동"></div>
      <label class="f" for="inPhone" id="phoneLabel">연락처</label>
      <input type="tel" id="inPhone" inputmode="numeric" autocomplete="tel" placeholder="예) 010-1234-5678">
      <div class="note" style="margin-top:8px" id="loginNote">받으시는 분 또는 주문하신 분의 성함과 연락처를 입력해 주세요.</div>
      <div id="senderWrap" class="hide">
        <div class="info" id="senderMsg" style="margin:14px 0 0"></div>
        <label class="f" for="inSender">보내신 분(주문하신 분) 성함</label>
        <input type="text" id="inSender" placeholder="선물을 보내신 분 성함">
      </div>
      <label class="chk"><input type="checkbox" id="agree"><span>배송 정보 변경 처리를 위해 성함·연락처·주소를 수집·이용하는 데 동의합니다. (보유기간: 해당 상품 출고 완료 시까지)</span></label>
      <button class="btn p" id="btnLogin">조회하기</button>
      <div class="err" id="loginErr"></div>
    </div>
  </section>

  <!-- 2. 목록 -->
  <section id="vList" class="hide">
    <div class="info" id="listInfo"></div>
    <div id="items"></div>
    <div class="card hide" id="moreCard">
      <b id="moreTitle"></b>
      <div class="note" style="margin-top:4px">받는 분 성함이 다르게(예: "엄마", 별칭) 등록된 선물입니다. 보내신 분 성함을 입력하시면 함께 보실 수 있어요.</div>
      <label class="f" for="inMore">보내신 분(주문하신 분) 성함</label>
      <input type="text" id="inMore" placeholder="선물을 보내신 분 성함">
      <button class="btn s" id="btnMore">찾기</button>
      <div class="err" id="moreErr"></div>
    </div>
    <button class="btn t" id="btnLogout">처음으로</button>
  </section>

  <!-- 3. 변경 입력 -->
  <section id="vEdit" class="hide">
    <div class="card item" id="editHead"></div>
    <div id="blocks"></div>
    <button class="btn s hide" id="btnAddBlk">+ 나머지 박스도 따로 변경하기</button>
    <div class="err" id="editErr"></div>
    <button class="btn p" id="btnSave">변경 신청하기</button>
    <button class="btn s hide" id="btnRevert">변경 취소 (원래대로 받기)</button>
    <button class="btn t" id="btnBack">목록으로</button>
  </section>

  <!-- 4. 완료 -->
  <section id="vDone" class="hide">
    <div class="card">
      <div class="big-ok"><div class="ic">✓</div><h2 id="doneTitle">변경이 완료되었습니다</h2><div class="note" id="doneSub"></div></div>
      <div id="doneBody"></div>
      <button class="btn p" id="btnDoneList">목록으로</button>
    </div>
  </section>

  <footer id="foot"></footer>
</div>

<div id="postWrap"><div id="postBox"><div class="bar"><span>주소 검색</span><button id="postClose">닫기 ✕</button></div><div id="postInner"></div></div></div>
<div class="loading" id="loading">처리 중…</div>

<script>
/* GitHub 등 외부 주소에서 열 때: 구글 앱스스크립트와 데이터만 주고받는 연결부 */
var API_URL = 'https://script.google.com/macros/s/AKfycbwDx9besSl4mxqEgk3H0NXKfuWqtqkoW_gJRlQ4s-6f67XTRDcKLCBibYqHTLxxNBgnPA/exec';
(function(){
  function Runner(ok, fail){ this._ok=ok; this._fail=fail; var self=this;
    ['apiConfig','apiLogin','apiSave','apiCancel'].forEach(function(fn){
      self[fn]=function(){
        var args=[].slice.call(arguments);
        var url=API_URL+'?api='+fn+'&d='+encodeURIComponent(JSON.stringify(args))+'&_='+Date.now();
        fetch(url,{method:'GET',credentials:'omit',redirect:'follow',cache:'no-store'})
          .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
          .then(function(j){ self._ok&&self._ok(j); })
          .catch(function(e){ self._fail&&self._fail(e); });
      };
    });
  }
  Runner.prototype.withSuccessHandler=function(f){ return new Runner(f,this._fail); };
  Runner.prototype.withFailureHandler=function(f){ return new Runner(this._ok,f); };
  window.google={script:{run:new Runner(), url:{getLocation:function(cb){
    var q={}; new URLSearchParams(location.search).forEach(function(v,k){ q[k]=v; });
    setTimeout(function(){ cb({parameter:q}); },0);
  }}}};
})();
</script>
<script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script>
var S = { token:'', name:'', phone:'', senders:[], cfg:null, items:[], cur:null, blocks:[], hidden:0 };
var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); };

function call(fn){
  var args=[].slice.call(arguments,1);
  $('loading').style.display='flex';
  return new Promise(function(res,rej){
    google.script.run
      .withSuccessHandler(function(r){ $('loading').style.display='none'; res(r); })
      .withFailureHandler(function(e){ $('loading').style.display='none'; rej(e); })[fn].apply(null,args);
  });
}
function show(v){ ['vLogin','vList','vEdit','vDone'].forEach(function(k){ $(k).classList.toggle('hide',k!==v); }); window.scrollTo(0,0); }

var WD=['일','월','화','수','목','금','토'];
function dLabel(ymd){ var p=String(ymd).split('-'); if(p.length<3) return ymd; var d=new Date(+p[0],+p[1]-1,+p[2]); return (+p[1])+'월 '+(+p[2])+'일('+WD[d.getDay()]+')'; }
function dlLabel(){ var c=S.cfg; var p=c.deadlineText.split(' '); var t=p[1].split(':'); var h=+t[0]; return dLabel(p[0])+' '+(h<12?'오전 ':'오후 ')+(h%12||12)+'시'+(t[1]!=='00'?' '+t[1]+'분':''); }

function setCfg(cfg){
  S.cfg=cfg;
  $('round').textContent='2026 사과사색 · '+cfg.round;
  $('foot').textContent= cfg.phone ? '문의 '+cfg.phone : '';
  var msg = cfg.closed
    ? '변경 기한('+dlLabel()+')이 지났습니다. 조회만 가능합니다.'
    : '출고일: <b>'+dLabel(cfg.baseDate)+'</b><br>변경 마감: <b>'+dlLabel()+'</b>까지'
      + '<div class="note" style="margin-top:8px">이 링크는 사과사색을 <b>받으시는 분</b>께 개별로 보내드리는 링크입니다. 받으시는 분이 직접 출고일·주소를 변경하실 수 있어요.</div>';
  $('loginInfo').innerHTML=msg; $('listInfo').innerHTML=msg;
}

/* ---------- 로그인 ---------- */
function applyMode(){
  var tk=!!S.token;
  $('nameWrap').classList.toggle('hide',tk);
  [].forEach.call(document.querySelectorAll('#vLogin .card > *'),function(el){ if(el.id!=='noLink') el.style.display= tk?'':'none'; });
  $('noLink').style.display= tk?'none':'block';
  $('phoneLabel').textContent= tk ? '휴대폰 번호 뒤 4자리' : '연락처';
  $('inPhone').placeholder= tk ? '예) 5678' : '예) 010-1234-5678';
  $('inPhone').setAttribute('autocomplete', tk ? 'off' : 'tel');
  $('loginNote').textContent= tk ? '본인 확인을 위해 문자를 받으신 휴대폰 번호의 뒤 4자리를 입력해 주세요.' : '받으시는 분 또는 주문하신 분의 성함과 연락처를 입력해 주세요.';
  $('inPhone').value='';
}
$('inPhone').addEventListener('input',function(){
  if(S.token){ var t=this.value.replace(/\D/g,''); this.value=t.length>4?t.slice(-4):t; return; }
  var d=this.value.replace(/\D/g,'').slice(0,11);
  this.value = d.length<4?d : d.length<8? d.slice(0,3)+'-'+d.slice(3) : d.slice(0,3)+'-'+d.slice(3,d.length-4)+'-'+d.slice(-4);
});
$('btnLogin').onclick=function(){
  var n=S.token?'':$('inName').value.trim(), p=$('inPhone').value.trim();
  $('loginErr').textContent='';
  if(S.token){ if(p.length!==4){ $('loginErr').textContent='휴대폰 번호 뒤 4자리를 입력해 주세요.'; return; } }
  else if(!n||p.replace(/\D/g,'').length<9){ $('loginErr').textContent='성함과 연락처를 입력해 주세요.'; return; }
  if(!$('agree').checked){ $('loginErr').textContent='개인정보 수집·이용에 동의해 주세요.'; return; }
  var sd=$('inSender').value.trim(), senders=sd?[sd]:[];
  call('apiLogin',n,p,senders,S.token).then(function(r){
    if(r.cfg) setCfg(r.cfg);
    if(r.needSender && !sd){ $('senderWrap').classList.remove('hide'); $('senderMsg').textContent=r.msg; $('inSender').focus(); return; }
    if(!r.ok){ $('loginErr').textContent= sd ? '보내신 분 성함으로도 찾지 못했습니다. 성함·연락처를 다시 확인하시거나 고객센터로 문의해 주세요.' : r.msg; return; }
    S.name=n; S.phone=p; S.senders=senders; S.items=r.items; S.hidden=r.hidden||0; renderList(); show('vList');
  }).catch(function(e){ $('loginErr').textContent='오류가 발생했습니다. 잠시 후 다시 시도해 주세요.'; });
};
$('btnLogout').onclick=function(){ S={token:S.token,name:'',phone:'',senders:[],cfg:S.cfg,items:[],cur:null,blocks:[],hidden:0}; $('inName').value=''; $('inPhone').value=''; $('inSender').value=''; $('senderWrap').classList.add('hide'); show('vLogin'); };
$('btnMore').onclick=function(){
  var sd=$('inMore').value.trim(); $('moreErr').textContent='';
  if(sd.length<2){ $('moreErr').textContent='보내신 분 성함을 입력해 주세요.'; return; }
  var before=S.items.length;
  call('apiLogin',S.name,S.phone,S.senders.concat([sd]),S.token).then(function(r){
    if(!r.ok||r.items.length===before){ $('moreErr').textContent='해당 성함으로 보내신 선물을 찾지 못했습니다.'; return; }
    S.senders.push(sd); S.items=r.items; S.hidden=r.hidden||0; $('inMore').value=''; renderList();
  });
};

/* ---------- 목록 ---------- */
function changeSummary(it){
  var list=it.changes||[], used=0, li=[];
  list.forEach(function(c){
    used+=c.qty;
    var parts=[];
    if(c.dateChange) parts.push('출고일 <b>'+dLabel(c.newDate)+'</b>');
    if(c.addrChange) parts.push('주소 변경('+esc(c.scope)+') → '+esc(c.name)+', '+esc(c.addr1)+' '+esc(c.addr2));
    li.push('<li>'+(it.qty>1?c.qty+'박스: ':'')+parts.join(' · ')+'</li>');
  });
  if(it.qty>1 && it.qty-used>0) li.push('<li>'+(it.qty-used)+'박스: 변경 없음 ('+dLabel(S.cfg.baseDate)+' 출고)</li>');
  return '<ul>'+li.join('')+'</ul>';
}
function renderList(){
  var closed=S.cfg.closed;
  $('items').innerHTML=S.items.map(function(it){
    var has=it.changes&&it.changes.length;
    var role='';
    var btn = closed ? '' : '<button class="btn '+(has?'s':'p')+'" data-id="'+esc(it.id)+'">'+(has?'수정하기':'출고일·주소 변경하기')+'</button>';
    return '<div class="card item">'
      + (has?'<span class="badge ok">변경 완료</span>':'<span class="badge no">변경 없음</span>')
      + (it.role==='주문자'?' <span class="badge no">주문하신 선물</span>':'')
      + '<h3>'+esc(it.product)+' × '+it.qty+'박스</h3>'
      + '<dl class="kv"><dt>받는 분</dt><dd>'+role+esc(it.recipient)+' ('+esc(it.phone)+')</dd>'
      + '<dt>주소</dt><dd>'+esc(it.addr)+'</dd>'
      + '<dt>출고일</dt><dd>'+dLabel(S.cfg.baseDate)+'</dd></dl>'
      + (has?'<div class="done"><b>변경이 완료되었습니다.</b>'+changeSummary(it)+'</div>':'')
      + btn + '</div>';
  }).join('');
  $('moreCard').classList.toggle('hide',!S.hidden);
  $('moreTitle').textContent='이 연락처로 받으시는 선물이 '+S.hidden+'건 더 있어요.';
  [].forEach.call($('items').querySelectorAll('button[data-id]'),function(b){ b.onclick=function(){ openEdit(b.getAttribute('data-id')); }; });
}

/* ---------- 변경 입력 ---------- */
function newBlock(qty){ return {qty:qty, dateChange:false, newDate:S.cfg.altDates[0]||'', addrChange:false, scope:'이번 차수만', name:'', phone:'', zip:'', addr1:'', addr2:''}; }
function openEdit(id){
  var it=S.items.filter(function(x){return x.id===id;})[0]; S.cur=it;
  S.blocks = (it.changes&&it.changes.length) ? it.changes.map(function(c){ return Object.assign(newBlock(c.qty),c); }) : [newBlock(it.qty)];
  $('editHead').innerHTML='<h3>'+esc(it.product)+' × '+it.qty+'박스</h3><dl class="kv"><dt>받는 분</dt><dd>'+esc(it.recipient)+' ('+esc(it.phone)+')</dd><dt>주소</dt><dd>'+esc(it.addr)+'</dd><dt>출고일</dt><dd>'+dLabel(S.cfg.baseDate)+'</dd></dl>'
    + (it.qty>1?'<div class="note" style="margin-top:8px">일부 박스만 바꾸시려면 아래에서 박스 수를 줄여 주세요. 나머지 박스는 원래대로 출고됩니다.</div>':'');
  $('btnRevert').classList.toggle('hide',!(it.changes&&it.changes.length));
  delete $('btnRevert').dataset.sure; $('btnRevert').textContent='변경 취소 (원래대로 받기)'; $('btnRevert').style.borderColor=''; $('btnRevert').style.color='';
  $('editErr').textContent='';
  renderBlocks(); show('vEdit');
}
function usedQty(){ return S.blocks.reduce(function(a,b){return a+b.qty;},0); }
function renderBlocks(){
  var it=S.cur, multi=it.qty>1;
  $('blocks').innerHTML=S.blocks.map(function(b,i){
    var max = it.qty - usedQty() + b.qty;
    var dates=S.cfg.altDates;
    var dateSel = dates.length>1
      ? '<div class="radios">'+dates.map(function(d){return '<label><input type="radio" name="nd'+i+'" value="'+d+'" '+(b.newDate===d?'checked':'')+' data-k="newDate" data-i="'+i+'">'+dLabel(d)+'</label>';}).join('')+'</div>'
      : '<div class="note">'+dLabel(S.cfg.baseDate)+' → <b style="color:var(--red)">'+dLabel(dates[0])+'</b> 출고로 변경됩니다.</div>';
    return '<div class="card blk">'
      + '<h4><span>'+(S.blocks.length>1?'변경 '+(i+1):'변경 내용')+'</span>'+(i>0?'<button data-del="'+i+'">삭제</button>':'')+'</h4>'
      + (multi ? '<label class="f">변경할 박스 수 (총 '+it.qty+'박스)</label><div class="stepper"><button data-step="-1" data-i="'+i+'">−</button><span>'+b.qty+'박스</span><button data-step="1" data-i="'+i+'" '+(b.qty>=max?'disabled':'')+'>+</button></div>' : '')
      + '<label class="toggle"><input type="checkbox" data-k="dateChange" data-i="'+i+'" '+(b.dateChange?'checked':'')+'>출고일 변경</label>'
      + (b.dateChange ? '<div class="sub" style="margin-top:8px">'+dateSel+'</div>' : '')
      + '<label class="toggle"><input type="checkbox" data-k="addrChange" data-i="'+i+'" '+(b.addrChange?'checked':'')+'>주소 변경</label>'
      + (b.addrChange ? '<div class="sub">'
          + '<label class="f">변경 범위</label><div class="radios">'
          + ['이번 차수만','남은 차수 모두'].map(function(s){return '<label><input type="radio" name="sc'+i+'" value="'+s+'" '+(b.scope===s?'checked':'')+' data-k="scope" data-i="'+i+'">'+s+'</label>';}).join('')+'</div>'
          + '<label class="f">받는 분 성함</label><input type="text" data-k="name" data-i="'+i+'" value="'+esc(b.name)+'">'
          + '<label class="f">받는 분 연락처</label><input type="tel" inputmode="numeric" data-k="phone" data-i="'+i+'" value="'+esc(b.phone)+'" placeholder="010-0000-0000">'
          + '<label class="f">주소</label><div class="row"><input type="text" data-k="zip" data-i="'+i+'" value="'+esc(b.zip)+'" placeholder="우편번호" readonly style="max-width:120px"><button class="btn s" style="margin:0" data-post="'+i+'">주소 검색</button></div>'
          + '<input type="text" data-k="addr1" data-i="'+i+'" value="'+esc(b.addr1)+'" placeholder="'+(S.manualAddr?'도로명 주소를 입력해 주세요':'주소 검색을 눌러 주세요')+'" '+(S.manualAddr?'':'readonly')+' style="margin-top:8px">'
          + '<input type="text" data-k="addr2" data-i="'+i+'" value="'+esc(b.addr2)+'" placeholder="상세주소 (동·호수 등)" style="margin-top:8px">'
          + '</div>' : '')
      + '</div>';
  }).join('');
  $('btnAddBlk').classList.toggle('hide', !(multi && usedQty()<it.qty));
  bindBlocks();
}
function bindBlocks(){
  var box=$('blocks');
  [].forEach.call(box.querySelectorAll('[data-k]'),function(el){
    var i=+el.getAttribute('data-i'), k=el.getAttribute('data-k');
    if(el.type==='checkbox') el.onchange=function(){ S.blocks[i][k]=el.checked; renderBlocks(); };
    else if(el.type==='radio') el.onchange=function(){ S.blocks[i][k]=el.value; };
    else el.oninput=function(){
      if(k==='phone'){ var d=el.value.replace(/\D/g,'').slice(0,11); el.value = d.length<4?d : d.length<8? d.slice(0,3)+'-'+d.slice(3) : d.slice(0,3)+'-'+d.slice(3,d.length-4)+'-'+d.slice(-4); }
      S.blocks[i][k]=el.value;
    };
  });
  [].forEach.call(box.querySelectorAll('[data-step]'),function(el){ el.onclick=function(){
    var i=+el.getAttribute('data-i'), b=S.blocks[i], max=S.cur.qty-usedQty()+b.qty;
    b.qty=Math.min(max,Math.max(1,b.qty+(+el.getAttribute('data-step')))); renderBlocks(); }; });
  [].forEach.call(box.querySelectorAll('[data-del]'),function(el){ el.onclick=function(){ S.blocks.splice(+el.getAttribute('data-del'),1); renderBlocks(); }; });
  [].forEach.call(box.querySelectorAll('[data-post]'),function(el){ el.onclick=function(){ openPost(+el.getAttribute('data-post')); }; });
}
$('btnAddBlk').onclick=function(){ S.blocks.push(newBlock(S.cur.qty-usedQty())); renderBlocks(); };

/* 주소 검색 (카카오 우편번호) */
function openPost(i){
  if(!window.daum||!daum.Postcode){
    S.manualAddr=true; renderBlocks();
    $('editErr').textContent='주소 검색을 불러오지 못했습니다. 주소를 직접 입력해 주세요.';
    var el=document.querySelector('[data-k="addr1"][data-i="'+i+'"]'); if(el) el.focus(); return;
  }
  $('postWrap').style.display='block'; $('postInner').innerHTML='';
  new daum.Postcode({
    oncomplete:function(d){
      var extra=[]; if(d.bname&&/[동로가]$/.test(d.bname)) extra.push(d.bname); if(d.buildingName&&d.apartment==='Y') extra.push(d.buildingName);
      S.blocks[i].zip=d.zonecode; S.blocks[i].addr1=d.roadAddress+(extra.length?' ('+extra.join(', ')+')':'');
      $('postWrap').style.display='none'; renderBlocks();
      var el=document.querySelector('[data-k="addr2"][data-i="'+i+'"]'); if(el) el.focus();
    }, width:'100%', height:'100%'
  }).embed($('postInner'));
}
$('postClose').onclick=function(){ $('postWrap').style.display='none'; };

$('btnSave').onclick=function(){
  var err='', bs=S.blocks;
  bs.forEach(function(b,i){
    var tag=bs.length>1?'[변경 '+(i+1)+'] ':'';
    if(!b.dateChange&&!b.addrChange) err=err||tag+'출고일 변경 또는 주소 변경을 선택해 주세요.';
    if(b.dateChange&&!b.newDate) err=err||tag+'출고일을 선택해 주세요.';
    if(b.addrChange){
      if(!b.name.trim()) err=err||tag+'받는 분 성함을 입력해 주세요.';
      else if(b.phone.replace(/\D/g,'').length<9) err=err||tag+'받는 분 연락처를 확인해 주세요.';
      else if(!b.addr1) err=err||tag+'주소 검색으로 주소를 입력해 주세요.';
      else if(!b.addr2.trim()) err=err||tag+'상세주소를 입력해 주세요. 없으면 "없음"이라고 적어 주세요.';
    }
  });
  if(err){ $('editErr').textContent=err; return; }
  if(S.busy) return; S.busy=1; $('btnSave').disabled=true; $('btnSave').dataset.t=$('btnSave').textContent; $('btnSave').textContent='저장 중...';
  var payload=bs.map(function(b){ return {qty:b.qty,dateChange:b.dateChange,newDate:b.newDate,addrChange:b.addrChange,scope:b.scope,name:b.name,phone:b.phone,zip:b.zip,addr1:b.addr1,addr2:b.addr2}; });
  var done=function(){ S.busy=0; $('btnSave').disabled=false; $('btnSave').textContent=$('btnSave').dataset.t; };
  call('apiSave',S.name,S.phone,S.senders,S.token,S.cur.id,payload).then(function(r){
    done();
    if(!r.ok){ $('editErr').textContent=r.msg; return; }
    replaceItem(r.item); showDone(r.item,'변경이 완료되었습니다');
  }).catch(function(){ done(); $('editErr').textContent='오류가 발생했습니다. 잠시 후 다시 시도해 주세요.'; });
};
$('btnRevert').onclick=function(){
  var b=$('btnRevert');
  if(!b.dataset.sure){ b.dataset.sure='1'; b.textContent='한 번 더 누르면 변경 신청이 취소됩니다'; b.style.borderColor='var(--red)'; b.style.color='var(--red)'; return; }
  if(S.busy) return; S.busy=1; b.disabled=true;
  var done=function(){ S.busy=0; b.disabled=false; };
  call('apiCancel',S.name,S.phone,S.senders,S.token,S.cur.id).then(function(r){
    done();
    if(!r.ok){ $('editErr').textContent=r.msg; return; }
    replaceItem(r.item); showDone(r.item,'원래대로 받으시도록 변경되었습니다');
  }).catch(function(){ done(); $('editErr').textContent='오류가 발생했습니다. 잠시 후 다시 시도해 주세요.'; });
};
$('btnBack').onclick=function(){ renderList(); show('vList'); };
function replaceItem(item){ S.items=S.items.map(function(x){return x.id===item.id?item:x;}); }
function showDone(it,title){
  $('doneTitle').textContent=title;
  $('doneSub').textContent=dlLabel()+'까지 목록에서 다시 수정하실 수 있습니다.';
  $('doneBody').innerHTML='<div class="done"><b>'+esc(it.product)+' × '+it.qty+'박스</b>'
    + (it.changes.length? changeSummary(it) : '<ul><li>'+dLabel(S.cfg.baseDate)+' 출고 · 기존 주소로 배송</li></ul>')+'</div>';
  show('vDone');
}
$('btnDoneList').onclick=function(){ renderList(); show('vList'); };
google.script.run.withSuccessHandler(setCfg).apiConfig();
google.script.url.getLocation(function(loc){
  S.token=(loc.parameter&&loc.parameter.k)||'';
  applyMode();
});
</script>
